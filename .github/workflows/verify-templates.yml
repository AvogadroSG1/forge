name: Verify Templates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

jobs:
  unit-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      # setup-go exports GOTOOLCHAIN=local to later steps; keep the same
      # override the go test step below uses.
      - name: go mod tidy -diff
        env:
          GOTOOLCHAIN: auto
        run: go mod tidy -diff
      # The otel task tests (test/otel_tasks_test.go) run `mise run otel*`
      # under the runner's dash and skip when mise is absent. Only the mise
      # binary is needed, so skip `mise install` of the root mise.toml.
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        with:
          version: 2026.11.9
          install: false
          env: false
      # The real-tool hook tests (test/lefthook_beads_hooks_test.go) need bd
      # and lefthook; FORGE_REQUIRE_HOOK_TOOLS makes a missing tool a failure
      # instead of a skip. lefthook matches the version the stacks pin.
      - name: Install bd (beads)
        env:
          BEADS_VERSION: 1.3.4
          BEADS_SHA256: 175c26904bde3ff9168d2282ff6b56f17b17f60c22fa5acb3dacc9fb3465303a
        run: |
          curl -fsSL -o /tmp/beads.tar.gz "https://github.com/gastownhall/beads/releases/download/v${BEADS_VERSION}/beads_${BEADS_VERSION}_linux_amd64.tar.gz"
          echo "${BEADS_SHA256}  /tmp/beads.tar.gz" | sha256sum -c -
          extract_dir=$(mktemp -d)
          tar -xzf /tmp/beads.tar.gz -C "$extract_dir"
          mkdir -p "$HOME/.local/bin"
          install -m 0755 "$(find "$extract_dir" -type f -name bd | head -n 1)" "$HOME/.local/bin/bd"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/bd" version
      - name: Install lefthook
        env:
          GOTOOLCHAIN: auto
          LEFTHOOK_VERSION: v2.2.2
        run: |
          GOBIN="$HOME/.local/bin" go install "github.com/evilmartians/lefthook/v2@${LEFTHOOK_VERSION}"
          "$HOME/.local/bin/lefthook" version
      # setup-go exports GOTOOLCHAIN=local to later steps. Generated repos
      # pin a newer Go than forge's go.mod, so let Go download the toolchain
      # their go.mod asks for. Step-level env wins over the exported value.
      - name: go test ./...
        env:
          GOTOOLCHAIN: auto
          FORGE_REQUIRE_HOOK_TOOLS: "1"
        run: |
          GOCACHE=$GITHUB_WORKSPACE/.cache/go-build go test ./... -count=1

  fast-gate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        with:
          version: 2026.11.9
          env: false
      - name: Install bd (beads)
        env:
          BEADS_VERSION: 1.3.4
          BEADS_SHA256: 175c26904bde3ff9168d2282ff6b56f17b17f60c22fa5acb3dacc9fb3465303a
        run: |
          curl -fsSL -o /tmp/beads.tar.gz "https://github.com/gastownhall/beads/releases/download/v${BEADS_VERSION}/beads_${BEADS_VERSION}_linux_amd64.tar.gz"
          echo "${BEADS_SHA256}  /tmp/beads.tar.gz" | sha256sum -c -
          extract_dir=$(mktemp -d)
          tar -xzf /tmp/beads.tar.gz -C "$extract_dir"
          mkdir -p "$HOME/.local/bin"
          install -m 0755 "$(find "$extract_dir" -type f -name bd | head -n 1)" "$HOME/.local/bin/bd"
          bd version
      # setup-go exports GOTOOLCHAIN=local to later steps. Generated repos
      # pin a newer Go than forge's go.mod, so let Go download the toolchain
      # their go.mod asks for. Step-level env wins over the exported value.
      - run: make verify-fast
        env:
          GOTOOLCHAIN: auto

  slow-gate:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        stack: [go-cli-cobra, python-cli-typer, csharp-cli, go-api-chi, python-fastapi, csharp-webapi]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        with:
          version: 2026.11.9
          env: false
      - name: Install bd (beads)
        env:
          BEADS_VERSION: 1.3.4
          BEADS_SHA256: 175c26904bde3ff9168d2282ff6b56f17b17f60c22fa5acb3dacc9fb3465303a
        run: |
          curl -fsSL -o /tmp/beads.tar.gz "https://github.com/gastownhall/beads/releases/download/v${BEADS_VERSION}/beads_${BEADS_VERSION}_linux_amd64.tar.gz"
          echo "${BEADS_SHA256}  /tmp/beads.tar.gz" | sha256sum -c -
          extract_dir=$(mktemp -d)
          tar -xzf /tmp/beads.tar.gz -C "$extract_dir"
          mkdir -p "$HOME/.local/bin"
          install -m 0755 "$(find "$extract_dir" -type f -name bd | head -n 1)" "$HOME/.local/bin/bd"
          bd version
      # setup-go exports GOTOOLCHAIN=local to later steps. Generated repos
      # pin a newer Go than forge's go.mod, so let Go download the toolchain
      # their go.mod asks for. Step-level env wins over the exported value.
      - run: >
          GOCACHE=$GITHUB_WORKSPACE/.cache/go-build
          go test -tags=integration -count=1 -timeout=10m
          -run "TestLocalRelease/${{ matrix.stack }}" ./test/
        env:
          GOTOOLCHAIN: auto
