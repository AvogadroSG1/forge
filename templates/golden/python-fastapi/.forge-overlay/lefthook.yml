    beads:
      run: |
        if command -v bd >/dev/null 2>&1; then
          BD_GIT_HOOK=1 bd hooks run post-merge {0} || { rc=$?; [ "$rc" -eq 3 ] || exit "$rc"; }
        fi

post-checkout:
  commands:
    beads:
      run: |
        if command -v bd >/dev/null 2>&1; then
          BD_GIT_HOOK=1 bd hooks run post-checkout {0} || { rc=$?; [ "$rc" -eq 3 ] || exit "$rc"; }
