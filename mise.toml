# Contributor task entry points for the forge generator itself. These wrap
# the same actions the root Makefile performs; the Makefile remains an
# independent, equivalent entry point (see ADR-0022) — not deprecated, and
# not driven by these tasks. A contributor without mise, or who prefers
# `make`, is not left behind. Task bodies MUST stay POSIX sh (`set -eu`, no
# bashisms): mise's default inline shell is `sh`, which is dash on
# Debian/Ubuntu.

[tools]
bats = "latest"

[tasks.build]
description = "Build the forge binary into bin/"
dir = "{{config_root}}"
run = '''
set -eu

# Keep tokf cache/tracking writes inside the repo for restricted
# environments, matching `make build`.
mkdir -p bin .cache/tokf
export GOCACHE="$PWD/.cache/go-build"
export TOKF_HOME="$PWD/.cache/tokf"
export TOKF_DB_PATH="$PWD/.cache/tokf/tracking.db"
go build -o bin/forge ./cmd/forge
'''

[tasks.test]
description = "Run the full Go test suite"
dir = "{{config_root}}"
run = '''
set -eu

GOCACHE="$PWD/.cache/go-build" go test ./... -count=1
'''

[tasks.run]
description = "Run forge from source: mise run run -- <forge args>"
dir = "{{config_root}}"
run = '''
set -eu

# mise appends any args after `--` to this line, e.g. `mise run run --
# init --help` runs `go run ./cmd/forge init --help`.
GOCACHE="$PWD/.cache/go-build" go run ./cmd/forge
'''

[tasks.install]
description = "Install forge into BINDIR (default $HOME/.local/bin)"
depends = ["build"]
dir = "{{config_root}}"
run = '''
set -eu

BINDIR="${BINDIR:-$HOME/.local/bin}"
mkdir -p "$BINDIR"
install -m 0755 bin/forge "$BINDIR/forge"
echo "install: wrote $BINDIR/forge"
'''

[tasks."install:completions"]
description = "Write the zsh completion script into FORGE_ZSH_COMPLETIONS_DIR"
depends = ["build"]
dir = "{{config_root}}"
run = '''
set -eu

FORGE_ZSH_COMPLETIONS_DIR="${FORGE_ZSH_COMPLETIONS_DIR:-${XDG_DATA_HOME:-$HOME/.local/share}/zsh/site-functions}"
mkdir -p "$FORGE_ZSH_COMPLETIONS_DIR"
bin/forge completion zsh > "$FORGE_ZSH_COMPLETIONS_DIR/_forge"
echo "install:completions: wrote $FORGE_ZSH_COMPLETIONS_DIR/_forge"
echo "install:completions: add '$FORGE_ZSH_COMPLETIONS_DIR' to fpath before compinit to enable it, e.g. in ~/.zshrc:"
echo "install:completions:   fpath=($FORGE_ZSH_COMPLETIONS_DIR \$fpath)"
echo "install:completions:   autoload -Uz compinit && compinit"
'''

[tasks.uninstall]
description = "Remove installed forge from BINDIR (default $HOME/.local/bin)"
dir = "{{config_root}}"
run = '''
set -eu

BINDIR="${BINDIR:-$HOME/.local/bin}"
rm -f "$BINDIR/forge"
'''

[tasks."uninstall:completions"]
description = "Remove the installed zsh completion script from FORGE_ZSH_COMPLETIONS_DIR"
dir = "{{config_root}}"
run = '''
set -eu

FORGE_ZSH_COMPLETIONS_DIR="${FORGE_ZSH_COMPLETIONS_DIR:-${XDG_DATA_HOME:-$HOME/.local/share}/zsh/site-functions}"
rm -f "$FORGE_ZSH_COMPLETIONS_DIR/_forge"
'''

[tasks.clean]
description = "Remove local build outputs"
dir = "{{config_root}}"
run = '''
set -eu

rm -rf bin
'''
