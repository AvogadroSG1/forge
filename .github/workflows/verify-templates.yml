name: Verify Templates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # The otel task tests (test/otel_tasks_test.go) run `mise run otel*`
      # under the runner's dash and skip when mise is absent. Only the mise
      # binary is needed, so skip `mise install` of the root mise.toml.
      - uses: jdx/mise-action@v5
        with:
          version: 2026.10.24
          install: false
      - name: go test ./...
        run: |
          GOCACHE=$GITHUB_WORKSPACE/.cache/go-build go test ./... -count=1

  fast-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: jdx/mise-action@v5
      - name: Install bd (beads)
        env:
          BEADS_VERSION: 1.3.2
          BEADS_SHA256: c6ea3281f6ff82628351b2d0967c9eb85862c8a0ec0ebc24e63e645c8b02462e
        run: |
          curl -fsSL -o /tmp/beads.tar.gz "https://github.com/gastownhall/beads/releases/download/v${BEADS_VERSION}/beads_${BEADS_VERSION}_linux_amd64.tar.gz"
          echo "${BEADS_SHA256}  /tmp/beads.tar.gz" | sha256sum -c -
          extract_dir=$(mktemp -d)
          tar -xzf /tmp/beads.tar.gz -C "$extract_dir"
          mkdir -p "$HOME/.local/bin"
          install -m 0755 "$(find "$extract_dir" -type f -name bd | head -n 1)" "$HOME/.local/bin/bd"
          bd version
      - run: make verify-fast

  slow-gate:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        stack: [go-cli-cobra, python-cli-typer, csharp-cli, go-api-chi, python-fastapi, csharp-webapi]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: jdx/mise-action@v5
      - name: Install bd (beads)
        env:
          BEADS_VERSION: 1.3.2
          BEADS_SHA256: c6ea3281f6ff82628351b2d0967c9eb85862c8a0ec0ebc24e63e645c8b02462e
        run: |
          curl -fsSL -o /tmp/beads.tar.gz "https://github.com/gastownhall/beads/releases/download/v${BEADS_VERSION}/beads_${BEADS_VERSION}_linux_amd64.tar.gz"
          echo "${BEADS_SHA256}  /tmp/beads.tar.gz" | sha256sum -c -
          extract_dir=$(mktemp -d)
          tar -xzf /tmp/beads.tar.gz -C "$extract_dir"
          mkdir -p "$HOME/.local/bin"
          install -m 0755 "$(find "$extract_dir" -type f -name bd | head -n 1)" "$HOME/.local/bin/bd"
          bd version
      - run: >
          GOCACHE=$GITHUB_WORKSPACE/.cache/go-build
          go test -tags=integration -count=1 -timeout=10m
          -run "TestLocalRelease/${{ matrix.stack }}" ./test/
