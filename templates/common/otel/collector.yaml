# forge-otel collector pipeline config.
# Managed by `mise run otel` (see .otel/compose.yaml). Do not edit the running
# container directly; edit this file and re-run `mise run otel` to apply.
# Re-running `mise run otel` RESTARTS the shared collector every time (it uses
# `--force-recreate`, since this bind-mounted file does not change the compose
# config hash). Telemetry from every repo pauses briefly; SDKs typically buffer
# or retry, but telemetry emitted during the gap MAY be dropped.

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
        cors:
          allowed_origins:
            - "http://localhost:*"
            - "http://127.0.0.1:*"

processors:
  memory_limiter:
    check_interval: 1s
    limit_percentage: 80
    spike_limit_percentage: 25
  batch: {}

exporters:
  debug:
    verbosity: basic
  file/traces:
    path: /data/traces.jsonl
    rotation:
      max_megabytes: 50
      max_backups: 3
  file/metrics:
    path: /data/metrics.jsonl
    rotation:
      max_megabytes: 50
      max_backups: 3
  file/logs:
    path: /data/logs.jsonl
    rotation:
      max_megabytes: 50
      max_backups: 3

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [debug, file/traces]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [debug, file/metrics]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [debug, file/logs]
