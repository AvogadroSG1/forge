name: beads-import-once

# One-off: imports the orchestration ticket into the shared Beads database.
# Runs only when this file itself is pushed to the PR branch. Delete after use.
on:
  push:
    branches: [claude/sdk-library-version-upgrades-5ac1v8]
    paths: [.github/workflows/beads-import-once.yml]

permissions:
  contents: write

concurrency:
  group: beads-import-once
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      BEADS_VERSION: 1.3.4
      BEADS_SHA256: 175c26904bde3ff9168d2282ff6b56f17b17f60c22fa5acb3dacc9fb3465303a
      EPIC: agentic_template_start-3xw
      TICKET: agentic_template_start-3xw.25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install bd
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/beads.tar.gz "https://github.com/gastownhall/beads/releases/download/v${BEADS_VERSION}/beads_${BEADS_VERSION}_linux_amd64.tar.gz"
          echo "${BEADS_SHA256}  /tmp/beads.tar.gz" | sha256sum -c -
          d=$(mktemp -d); tar -xzf /tmp/beads.tar.gz -C "$d"
          mkdir -p "$HOME/.local/bin"
          install -m 0755 "$(find "$d" -type f -name bd | head -n 1)" "$HOME/.local/bin/bd"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Configure git for the Dolt remote
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global credential.helper store
          printf 'https://x-access-token:%s@github.com\n' "$GH_TOKEN" > "$HOME/.git-credentials"
          chmod 600 "$HOME/.git-credentials"
      - name: Clone the shared database
        run: |
          set -euo pipefail
          bd version
          git ls-remote origin refs/dolt/data
          bd bootstrap --dry-run 2>&1 | tee /tmp/plan.txt
          grep -q "Bootstrap plan: clone from remote" /tmp/plan.txt
          bd bootstrap --yes
          bd stats
      - name: Import the ticket
        run: |
          set -euo pipefail
          bd show "$EPIC" >/dev/null 2>&1
          if bd show "$TICKET" >/dev/null 2>&1; then
            echo "Ticket already present in the shared database; nothing to do."
            echo "SKIP_PUSH=1" >> "$GITHUB_ENV"
            exit 0
          fi
          grep "\"id\":\"${TICKET}\"" .beads/issues.jsonl > /tmp/import.jsonl
          test "$(wc -l < /tmp/import.jsonl)" -eq 1
          bd import /tmp/import.jsonl --dry-run 2>&1 | tee /tmp/dry.txt
          grep -q "1 new, 0 updated" /tmp/dry.txt
          bd import /tmp/import.jsonl
          bd show "$TICKET"
          bd stats
      - name: Push the shared database
        if: env.SKIP_PUSH != '1'
        run: |
          set -euo pipefail
          bd dolt push
          git ls-remote origin refs/dolt/data
      - name: Remove credentials
        if: always()
        run: rm -f "$HOME/.git-credentials"
