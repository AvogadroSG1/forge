[tools]
go = "1.26.11"
golangci-lint = "2.15.0"
"go:golang.org/x/vuln/cmd/govulncheck" = "1.10.0"
"go:github.com/a-h/templ/cmd/templ" = "v0.3.1118"
lefthook = "2.2.2"
"github:Dicklesworthstone/destructive_command_guard" = "0.16.0"

[tasks.fmt]
run = "templ generate && gofmt -w $(find . -name '*.go' -not -path './.git/*')"

[tasks.lint]
run = "golangci-lint run ./..."

[tasks.test]
run = "go test -cover ./..."

[tasks.ci]
run = "mise run fmt && mise run lint && mise run test && govulncheck ./..."
