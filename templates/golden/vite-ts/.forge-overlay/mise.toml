[tools]
node = "26.13.1"
lefthook = "2.2.2"
"github:Dicklesworthstone/destructive_command_guard" = "0.16.0"

[tasks.fmt]
run = "npm run fmt"

[tasks.lint]
run = "npm run lint && npm run typecheck"

[tasks.test]
run = "npm test"

[tasks.ci]
run = "mise run fmt && mise run lint && mise run test && npm audit --audit-level=high"
